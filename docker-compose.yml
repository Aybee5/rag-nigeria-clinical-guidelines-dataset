services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-nigeria-app
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      DATABASE_URL: sqlite:////app/data/clinical_rag.db
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - rag_backend_data:/app/data
    restart: unless-stopped

volumes:
  rag_backend_data:
